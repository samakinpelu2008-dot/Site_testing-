<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshers Cup – CPE vs FRM</title>
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b8f2f;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* SCOREBOARD CARD */
.scoreboard{
  background:white;
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,0.3);
  margin-bottom:20px;
}
.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.team{
  width:30%;
}
.team img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:50%;
}
.vs{
  font-size:28px;
  font-weight:bold;
  color:#333;
}
.info{
  text-align:left;
  background:#f5f5f5;
  border-radius:12px;
  padding:10px;
  margin-top:15px;
}
.info p{
  margin:5px 0;
}

/* LIVE INDICATOR */
.live{
  display:inline-block;
  background:#00c853;
  color:white;
  padding:4px 12px;
  font-weight:bold;
  border-radius:6px;
  margin-bottom:10px;
  animation: move 1s infinite alternate;
}
@keyframes move{
  from{transform:translateX(-6px);}
  to{transform:translateX(6px);}
}

/* TIMER */
#timer{
  font-size:28px;
  font-weight:bold;
  margin:10px 0;
}

/* PITCH & FORMATION */
.pitch{
  width:100%;
  background:url('https://i.ibb.co/ZmRhnCq/grass3.jpg');
  background-size:cover;
  background-position:center;
  border-radius:15px;
  padding:20px 0;
  margin-bottom:20px;
}
.formation{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  text-align:center;
  color:white;
  font-weight:bold;
  font-size:13px;
}
.player{
  background:rgba(0,0,0,0.6);
  margin:5px;
  padding:8px;
  border-radius:8px;
}

/* GOAL SCORERS */
.goalbox{
  background:#f7f7f7;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

/* COMMENTARY */
.commentary{
  background:#f9f9f9;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
}

</style>
</head>
<body>
<div class="container">

<!-- SCOREBOARD -->
<div class="scoreboard" id="scoreboard">

  <div id="liveIndicator"></div>

  <h2 id="timerDisplay"></h2>

  <div class="teams">
    <div class="team">
      <img src="https://i.ibb.co/XfTKYHJ0/IMG-20251009-WA0089.jpg" alt="CPE Logo">
      <h3>CPE</h3>
    </div>
    <div class="vs" id="scoreVS">VS</div>
    <div class="team">
      <img src="https://i.ibb.co/rR9PL8DG/IMG-20251116-200233.png" alt="FRM Logo">
      <h3>FRM</h3>
    </div>
  </div>

  <div class="info">
    <p><strong>Competition:</strong> Freshers Cup</p>
    <p><strong>Stage:</strong> First Stage</p>
    <p><strong>Venue:</strong> Lico Field</p>
    <p><strong>Location:</strong> LAUTECH Ogbomosho</p>
    <p><strong>Weather:</strong> Sunny</p>
    <p><strong>Kick Off:</strong> 11:00 AM</p>
  </div>

</div>

<!-- FORMATION PITCH -->
<div class="pitch" id="pitch">
  <div class="formation" id="formationCPE"></div>
  <div class="formation" id="formationFRM" style="margin-top:15px;"></div>
</div>

<!-- GOAL SCORERS -->
<div class="goalbox" id="goalBox">
  <h3>Goal Scorers</h3>
  <p id="goals">None yet</p>
</div>

<!-- COMMENTARY -->
<div class="commentary" id="commentary">
  <h3>Live Updates</h3>
  <p id="liveComments">Match has not started.</p>
</div>

</div>

<script>
// ==========================
// STAGE CONTROL
// "PRE" = Pre-match
// "FH" = First Half
// "HT" = Half Time
// "SH" = Second Half
// "FT" = Full Time
// ==========================
let stage = "PRE"; // Change this to control the page

// ==========================
// FORMATION DATA
// 4-3-3 for both
const formationCPE = ["GK","LB","CB","CB","RB","CM","CM","CAM","LW","ST","RW"];
const formationFRM = ["GK","LB","CB","CB","RB","CM","CM","CAM","LW","ST","RW"];

// ==========================
// RENDER FORMATIONS
function renderFormation(teamId, formation){
  const container = document.getElementById(teamId);
  container.innerHTML = "";
  formation.forEach(pos=>{
    const div = document.createElement("div");
    div.className="player";
    div.textContent=pos;
    container.appendChild(div);
  });
}

// ==========================
// TIMER
let seconds = 0;
let timerInterval;
function startTimer(){
  document.getElementById("timerDisplay").textContent="0:00";
  timerInterval = setInterval(()=>{
    seconds++;
    let mins = Math.floor(seconds/60);
    let secs = seconds%60;
    if(seconds<=1800){
      document.getElementById("timerDisplay").textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
    } else {
      let extra = seconds-1800;
      document.getElementById("timerDisplay").textContent = `30:00 +${extra}`;
    }
  },1000);
}

// ==========================
// UPDATE PAGE BASED ON STAGE
function updateStage(){
  const liveDiv = document.getElementById("liveIndicator");
  const scoreVS = document.getElementById("scoreVS");
  const liveComments = document.getElementById("liveComments");

  if(stage=="PRE"){
    liveDiv.innerHTML="";
    scoreVS.textContent="VS";
    liveComments.textContent="Match has not started.";
  } else if(stage=="FH" || stage=="SH"){
    liveDiv.innerHTML='<div class="live">LIVE</div>';
    scoreVS.textContent="0 - 0";
    liveComments.textContent="Match in progress...";
    startTimer();
  } else if(stage=="HT"){
    liveDiv.innerHTML="";
    scoreVS.textContent="0 - 0";
    liveComments.textContent="Half time.";
    clearInterval(timerInterval);
  } else if(stage=="FT"){
    liveDiv.innerHTML="";
    scoreVS.textContent="0 - 0";
    liveComments.textContent="Full time.";
    clearInterval(timerInterval);
  }
}

// ==========================
// INITIALIZE
renderFormation("formationCPE", formationCPE);
renderFormation("formationFRM", formationFRM);
updateStage();

</script>
</body>
</html>

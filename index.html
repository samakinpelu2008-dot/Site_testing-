<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshers Cup – CPE vs FRM</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================
   GLOBAL STYLES
========================= */
body{
  margin:0;
  font-family: 'Roboto', sans-serif;
  background: linear-gradient(135deg,#0b8f2f,#065f2b);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:20px;
  box-sizing:border-box;
  color:#fff;
}

/* =========================
   SCOREBOARD CARD
========================= */
.card{
  background: linear-gradient(145deg, #1e1e2f, #2c2c45);
  width:100%;
  max-width:700px;
  border-radius:25px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  overflow:hidden;
  padding:30px 20px;
  animation: fadeIn 1.2s ease-out;
}
@keyframes fadeIn{
  from{opacity:0; transform: translateY(-20px);}
  to{opacity:1; transform: translateY(0);}
}

/* TEAM ROW */
.team-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.team{
  text-align:center;
  flex:1;
}
.team img{
  width:90px;
  height:90px;
  border-radius:50%;
  border:3px solid #fff;
  margin-bottom:10px;
  transition: transform 0.3s;
}
.team img:hover{
  transform: scale(1.1);
}
.team h2{
  margin:0;
  font-size:22px;
  letter-spacing:1px;
}

/* VS AND SCORE */
.vs{
  font-size:32px;
  font-weight:700;
  color:#ffdd00;
  margin:0 15px;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse{
  0%{transform: scale(1);}
  100%{transform: scale(1.1);}
}

/* SCORE NUMBERS */
.score{
  font-size:48px;
  font-weight:900;
  color:#00ffcc;
  margin-top:5px;
  transition: all 0.5s ease-in-out;
}

/* INFO BOX */
.info-box{
  background: rgba(255,255,255,0.1);
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
  line-height:1.6;
}
.info-box p{
  margin:5px 0;
  font-size:15px;
}

/* LIVE INDICATOR */
.live{
  display:inline-block;
  background:#ff3d00;
  color:#fff;
  font-weight:700;
  padding:5px 15px;
  border-radius:12px;
  margin-bottom:15px;
  animation: liveAnim 1s infinite alternate;
}
@keyframes liveAnim{
  0%{transform: translateX(-5px);}
  100%{transform: translateX(5px);}
}

/* TIMER */
#timer{
  font-size:28px;
  font-weight:700;
  color:#ffdd00;
  margin-bottom:20px;
  text-align:center;
}

/* GOAL SCORERS */
.goal-box{
  background: rgba(255,255,255,0.1);
  padding:12px;
  border-radius:12px;
}
.goal-box h3{
  margin:0 0 8px 0;
  font-size:18px;
  color:#00ffcc;
}
.goal-box p{
  margin:0;
}

/* COMMENTARY */
.commentary{
  background: rgba(255,255,255,0.1);
  border-radius:12px;
  padding:12px;
  margin-top:20px;
}
.commentary h3{
  margin:0 0 8px 0;
  color:#ffdd00;
}
.commentary p{
  margin:0;
  font-size:14px;
}

/* RESPONSIVE */
@media(max-width:600px){
  .team-row{
    flex-direction:column;
  }
  .vs{
    margin:15px 0;
  }
}

</style>
</head>
<body>

<div class="card">

  <!-- LIVE & TIMER -->
  <div id="liveIndicator"></div>
  <div id="timer">0:00</div>

  <!-- TEAMS -->
  <div class="team-row">
    <div class="team">
      <img src="https://i.ibb.co/XfTKYHJ0/IMG-20251009-WA0089.jpg" alt="CPE Logo">
      <h2>CPE</h2>
      <div class="score" id="scoreCPE">0</div>
    </div>
    <div class="vs" id="vsDisplay">VS</div>
    <div class="team">
      <img src="https://i.ibb.co/rR9PL8DG/IMG-20251116-200233.png" alt="FRM Logo">
      <h2>FRM</h2>
      <div class="score" id="scoreFRM">0</div>
    </div>
  </div>

  <!-- INFO SECTION -->
  <div class="info-box">
    <p><strong>Competition:</strong> Freshers Cup</p>
    <p><strong>Stage:</strong> First Stage</p>
    <p><strong>Venue:</strong> Lico Field</p>
    <p><strong>Location:</strong> LAUTECH Ogbomosho</p>
    <p><strong>Weather:</strong> Sunny</p>
    <p><strong>Kick Off:</strong> 11:00 AM</p>
  </div>

  <!-- GOAL SCORERS -->
  <div class="goal-box">
    <h3>Goal Scorers</h3>
    <p id="goals">None yet</p>
  </div>

  <!-- LIVE COMMENTARY -->
  <div class="commentary">
    <h3>Live Updates</h3>
    <p id="liveComments">Match has not started.</p>
  </div>

</div>

<script>
// =======================
// MASTER CONTROLS
// =======================

// STAGE: PRE, FH, HT, SH, FT
let stage = "FH";

// SCORES
let scoreCPE = 0;
let scoreFRM = 0;

// TIMER
let seconds = 0;
let timerInterval;

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    let mins = Math.floor(seconds/60);
    let secs = seconds%60;
    document.getElementById("timer").textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
    // Extra time after 30:00
    if(seconds>1800){
      let extra = seconds-1800;
      document.getElementById("timer").textContent = `30:00 +${extra}`;
    }
  },1000);
}

// UPDATE STAGE DISPLAY
function updateStage(){
  const liveDiv = document.getElementById("liveIndicator");
  const vsDisplay = document.getElementById("vsDisplay");
  const liveComments = document.getElementById("liveComments");

  if(stage=="PRE"){
    liveDiv.innerHTML="";
    vsDisplay.textContent="VS";
    liveComments.textContent="Match has not started.";
    clearInterval(timerInterval);
  } else if(stage=="FH" || stage=="SH"){
    liveDiv.innerHTML='<div class="live">LIVE</div>';
    vsDisplay.textContent=`${scoreCPE} - ${scoreFRM}`;
    liveComments.textContent="Match in progress...";
    startTimer();
  } else if(stage=="HT"){
    liveDiv.innerHTML="";
    vsDisplay.textContent=`${scoreCPE} - ${scoreFRM}`;
    liveComments.textContent="Half time.";
    clearInterval(timerInterval);
  } else if(stage=="FT"){
    liveDiv.innerHTML="";
    vsDisplay.textContent=`${scoreCPE} - ${scoreFRM}`;
    liveComments.textContent="Full time.";
    clearInterval(timerInterval);
  }
}

// UPDATE SCORES (Animated)
function updateScore(team, goals){
  if(team=="CPE") scoreCPE=goals;
  else if(team=="FRM") scoreFRM=goals;
  const displayCPE = document.getElementById("scoreCPE");
  const displayFRM = document.getElementById("scoreFRM");

  displayCPE.textContent = scoreCPE;
  displayFRM.textContent = scoreFRM;
  // Animate pulse
  displayCPE.style.transform="scale(1.5)";
  displayFRM.style.transform="scale(1.5)";
  setTimeout(()=>{
    displayCPE.style.transform="scale(1)";
    displayFRM.style.transform="scale(1)";
  },300);
}

// UPDATE GOAL SCORERS
function addGoalScorer(player){
  const goalsEl = document.getElementById("goals");
  if(goalsEl.textContent=="None yet") goalsEl.textContent=player;
  else goalsEl.textContent += ", "+player;
}

// UPDATE LIVE COMMENTARY
function addComment(text){
  document.getElementById("liveComments").textContent=text;
}

// INITIAL RENDER
updateStage();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPE LIVE MATCH</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
    }

    header {
        background: #0033cc;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
    }

    .section {
        padding: 15px;
        border-bottom: 1px solid #ddd;
    }

    h2 {
        margin-top: 0;
    }

    input, textarea {
        width: 90%;
        padding: 10px;
        margin-top: 10px;
        border: 1px solid #999;
        border-radius: 5px;
        font-size: 16px;
    }

    button {
        padding: 10px 18px;
        margin-top: 10px;
        background: #0033cc;
        border: none;
        color: white;
        border-radius: 5px;
        font-size: 16px;
    }

    .scoreboard {
        text-align: center;
        padding: 20px 0;
        font-size: 35px;
        font-weight: bold;
    }

    .timerBox {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .item {
        padding: 10px;
        background: #f2f2f2;
        margin-top: 10px;
        border-radius: 5px;
        position: relative;
    }

    .delete-btn {
        position: absolute;
        top: 5px;
        right: 10px;
        background: red;
        padding: 5px 10px;
        border: none;
        color: white;
        border-radius: 5px;
        display: none;
    }

    /* HEART ANIMATION */
    .heart {
        position: fixed;
        font-size: 25px;
        color: green;
        animation: floatUp 2s linear;
        pointer-events: none;
    }

    @keyframes floatUp {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-250px); }
    }

    #adminPanel {
        background: #eee;
        padding: 15px;
        display: none;
    }
</style>
</head>
<body>

<header>CPE LIVE MATCH</header>

<!-- SCOREBOARD -->
<div class="scoreboard">
    <span id="scoreA">0</span> - <span id="scoreB">0</span>
</div>

<!-- TIMER -->
<div class="timerBox">
    <span id="timer">0'</span>
</div>

<div class="section">
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
</div>

<!-- ADMIN LOGIN -->
<div class="section">
    <h2>Admin Login</h2>
    <input id="adminUser" placeholder="Enter Username">
    <input id="adminPass" placeholder="Enter Password" type="password">
    <button onclick="loginAdmin()">Login</button>
</div>

<div id="adminPanel">
    <h2>Admin Panel</h2>
    <p>Delete unlocked for admin.</p>
</div>

<!-- LIVE UPDATES -->
<div class="section">
    <h2>Live Update</h2>
    <textarea id="liveInput" placeholder="Enter update..."></textarea>
    <button onclick="addLive()">Post Update</button>
    <div id="liveList"></div>
</div>

<!-- SCORERS -->
<div class="section">
    <h2>Scorers</h2>
    <textarea id="scoreInput" placeholder="Enter scorer name..."></textarea>
    <button onclick="addScorer()">Add Scorer</button>
    <div id="scoreList"></div>
</div>

<!-- COMMENTS -->
<div class="section">
    <h2>Fan Comments</h2>
    <textarea id="commentInput" placeholder="Write comment..."></textarea>
    <button onclick="addComment()">Post Comment</button>
    <div id="commentList"></div>
</div>

<script>
let isAdmin = false;

// TIMER SYSTEM
let minute = 0;
let timerRunning = false;
let interval;

function startTimer() {
    if (timerRunning) return;

    timerRunning = true;
    interval = setInterval(() => {
        minute++;

        if (minute <= 90) {
            document.getElementById("timer").innerHTML = minute + "'";
        } else {
            let extra = minute - 90;
            document.getElementById("timer").innerHTML = "90+" + extra + "'";
        }
    }, 1000); // 1 second = 1 minute (football simulation)
}

function pauseTimer() {
    clearInterval(interval);
    timerRunning = false;
}

function resetTimer() {
    clearInterval(interval);
    timerRunning = false;
    minute = 0;
    document.getElementById("timer").innerHTML = "0'";
}


// ADMIN LOGIN
function loginAdmin() {
    const u = document.getElementById("adminUser").value.trim();
    const p = document.getElementById("adminPass").value.trim();

    if (u === "CPESPORT'S" && p === "CPE2025") {
        isAdmin = true;
        document.getElementById("adminPanel").style.display = "block";
        enableDeleteButtons();
        alert("Admin Unlocked!");
    } else {
        alert("Wrong admin details");
    }
}

function enableDeleteButtons() {
    document.querySelectorAll(".delete-btn").forEach(btn => btn.style.display = "block");
}


// HEART ANIMATION
document.body.addEventListener("click", function(e) {
    let h = document.createElement("div");
    h.className = "heart";
    h.style.left = e.clientX + "px";
    h.style.top = e.clientY + "px";
    h.innerHTML = "💚";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2000);
});


// ADD LIVE UPDATE
function addLive() {
    const text = document.getElementById("liveInput").value.trim();
    if (!text) return;

    let div = makeItem(text);
    document.getElementById("liveList").appendChild(div);
    document.getElementById("liveInput").value = "";
}

// ADD SCORER
function addScorer() {
    const text = document.getElementById("scoreInput").value.trim();
    if (!text) return;

    let div = makeItem(text);
    document.getElementById("scoreList").appendChild(div);
    document.getElementById("scoreInput").value = "";
}

// ADD COMMENT
function addComment() {
    const text = document.getElementById("commentInput").value.trim();
    if (!text) return;

    let div = makeItem(text);
    document.getElementById("commentList").appendChild(div);
    document.getElementById("commentInput").value = "";
}


// CREATE ITEM BOX
function makeItem(text) {
    let div = document.createElement("div");
    div.className = "item";
    div.innerHTML = text;

    let del = document.createElement("button");
    del.className = "delete-btn";
    del.innerHTML = "Delete";
    del.onclick = () => div.remove();

    if (isAdmin) del.style.display = "block";

    div.appendChild(del);
    return div;
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshers Cup Live</title>
<style>
  body {margin:0; font-family: Arial,sans-serif; background:#0b3d0b; color:white;}
  header{background:#111; color:gold; padding:20px; text-align:center; font-size:28px; font-weight:bold;}
  .scoreboard{
    background:#1b4d1b; margin:20px auto; width:90%; padding:15px; border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.5); text-align:center;
  }
  .teams{display:flex; justify-content:space-around; align-items:center; font-size:24px;}
  .teams img{width:50px; height:50px;}
  .info-section{margin-top:10px; font-size:18px;}
  #liveBar{
    height:6px; width:15%; background:#00ff00; border-radius:3px;
    margin:5px auto; display:none; animation: liveMove 3s infinite ease-in-out;
  }
  @keyframes liveMove{
    0%   { transform: translateX(-100%) scaleX(0); opacity:0; }
    25%  { transform: translateX(0%) scaleX(1); opacity:1; }
    50%  { transform: translateX(100%) scaleX(0); opacity:0; }
    75%  { transform: translateX(0%) scaleX(1); opacity:1; }
    100% { transform: translateX(-100%) scaleX(0); opacity:0; }
  }
  #timer{font-size:24px; margin:10px 0; color:#00ff00;}
  .goal-scorers{margin-top:10px;}
  #fanComments, #liveComments{
    background:#134d13; padding:10px; border-radius:8px; margin:10px 0; max-height:200px; overflow-y:auto;
  }
  #fanComments p,#liveComments p{margin:5px 0;}
  .floatingHeart{
    position:absolute;font-size:28px;animation: floatUp 2s ease-out forwards;pointer-events:none;
  }
  @keyframes floatUp{
    0% {opacity:1; transform: translateY(0) scale(1);}
    50% {opacity:1; transform: translateY(-80px) scale(1.3);}
    100% {opacity:0; transform: translateY(-160px) scale(1.5);}
  }
  input,button{padding:5px; margin:3px;}
</style>
</head>
<body>
<header>Freshers Cup Live</header>

<div class="scoreboard">
  <div class="teams">
    <div><strong>CPE Class 30</strong><br><img src="https://i.ibb.co/rR9PL8DG/IMG-20251116-200233.png"></div>
    <div id="scoreDisplay" style="font-size:28px; font-weight:bold;">VS</div>
    <div><strong>FRM Class 30</strong><br><img src="https://i.ibb.co/rR9PL8DG/IMG-20251116-200233.png"></div>
  </div>
  <div class="info-section">
    <p>Event: Freshers Cup | Stage: First Stage</p>
    <p>Venue: Lico Field, Lautech Ogbomosho</p>
    <p>Weather: Sunny | Kickoff: 11:00</p>
  </div>
  <div id="timer">00:00</div>
  <div id="liveBar"></div>
  <div class="goal-scorers" id="goalScorers"><strong>Goal Scorers:</strong></div>
</div>

<!-- Fan Comments -->
<div>
  <h3>Fan Comments</h3>
  <div id="fanComments"></div>
  <input type="text" id="fanComment" placeholder="Write comment...">
  <button onclick="addFanComment()">Send</button>
</div>

<!-- Live Updates -->
<div>
  <h3>Live Updates</h3>
  <div id="liveComments"></div>
  <input type="text" id="commentText" placeholder="Write update...">
  <button onclick="addCommentary()">Post Update</button>
</div>

<!-- Love Button -->
<button id="loveButton" style="position:fixed; bottom:20px; right:20px; padding:10px; font-size:20px;">💚</button>

<script type="module">
// Firebase setup
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2AScPQkOE632znM9vvCahijtnronS3jU",
  authDomain: "fresherscuplive.firebaseapp.com",
  databaseURL: "https://fresherscuplive-default-rtdb.firebaseio.com",
  projectId: "fresherscuplive",
  storageBucket: "fresherscuplive.appspot.com",
  messagingSenderId: "502451588704",
  appId: "1:502451588704:web:56bd4d7fc98814cddfbd05"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- TIMER LOGIC ----------------
let matchState = "preMatch"; // preMatch, firstHalf, halfTime, secondHalf, fullTime
let matchStartTime = null;
let elapsedBefore = 0;
const timerEl = document.getElementById("timer");
const liveBarEl = document.getElementById("liveBar");
const firstHalfDuration = 30*60; // seconds
const secondHalfDuration = 30*60;
const extraTimeDuration = 5*60;

function startMatchPhase(phase){
  matchState = phase;
  if(phase==="preMatch"){ timerEl.textContent="00:00"; liveBarEl.style.display="none"; return;}
  if(phase==="firstHalf"){ matchStartTime = Date.now(); elapsedBefore=0; liveBarEl.style.display="block"; requestAnimationFrame(updateTimer);}
  if(phase==="halfTime"){ liveBarEl.style.display="none"; }
  if(phase==="secondHalf"){ matchStartTime=Date.now(); elapsedBefore=firstHalfDuration; liveBarEl.style.display="block"; requestAnimationFrame(updateTimer);}
  if(phase==="fullTime"){ liveBarEl.style.display="none"; }
}

function updateTimer(){
  if(matchState==="preMatch" || matchState==="halfTime" || matchState==="fullTime") return;
  let elapsed = Math.floor((Date.now()-matchStartTime)/1000) + elapsedBefore;
  let minutes = Math.floor(elapsed/60);
  let seconds = elapsed%60;
  if(matchState==="firstHalf" && elapsed>=firstHalfDuration) timerEl.textContent=`30:00 +${elapsed-firstHalfDuration}`;
  else if(matchState==="secondHalf" && elapsed>=firstHalfDuration+secondHalfDuration) timerEl.textContent=`60:00 +${elapsed-(firstHalfDuration+secondHalfDuration)}`;
  else timerEl.textContent=(minutes<10?'0':'')+minutes+':'+(seconds<10?'0':'')+seconds;
  requestAnimationFrame(updateTimer);
}

// ---------------- FAN COMMENTS ----------------
let userId = localStorage.getItem("fanId");
if(!userId){ userId="fan_"+Math.floor(Math.random()*1000000); localStorage.setItem("fanId", userId);}
const fanRef = ref(db, "fans");
function addFanComment(){
  const text=document.getElementById("fanComment").value.trim(); if(!text) return;
  const id = Date.now();
  set(ref(db, `fans/${id}`), {text,user:userId});
  document.getElementById("fanComment").value="";
}
onValue(fanRef, snapshot=>{
  const data = snapshot.val()||{};
  const fanDiv = document.getElementById("fanComments");
  fanDiv.innerHTML="";
  Object.keys(data).forEach(id=>{
    const c = data[id];
    const p=document.createElement("p");
    p.textContent=c.text;
    if(c.user===userId){
      const del=document.createElement("span");
      del.textContent=" 🗑️"; del.style.cursor="pointer"; del.style.marginLeft="5px";
      del.onclick=()=> remove(ref(db, `fans/${id}`));
      p.appendChild(del);
    }
    fanDiv.appendChild(p);
  });
});

// ---------------- LIVE UPDATES ----------------
const matchRef = ref(db,"liveComments");
function addCommentary(){
  const text=document.getElementById("commentText").value.trim(); if(!text) return;
  const id=Date.now();
  set(ref(db, `liveComments/${id}`), {text,user:"admin"});
  document.getElementById("commentText").value="";
}
onValue(matchRef, snapshot=>{
  const data = snapshot.val()||{};
  const liveDiv = document.getElementById("liveComments");
  liveDiv.innerHTML="";
  Object.keys(data).forEach(id=>{
    const c=data[id];
    const p=document.createElement("p");
    p.textContent=c.text;
    if(c.user==="admin"){
      const del=document.createElement("span");
      del.textContent=" 🗑️"; del.style.cursor="pointer"; del.style.marginLeft="5px";
      del.onclick=()=> remove(ref(db, `liveComments/${id}`));
      p.appendChild(del);
    }
    liveDiv.appendChild(p);
  });
});

// ---------------- FLOATING HEARTS ----------------
document.getElementById("loveButton").addEventListener("click", e=>{
  const heart=document.createElement("div");
  heart.className="floatingHeart"; heart.textContent="💚";
  heart.style.left=(e.clientX-14)+"px"; heart.style.top=(e.clientY-14)+"px";
  document.body.appendChild(heart); setTimeout(()=>heart.remove(),2000);
});
</script>
</body>
</html>
